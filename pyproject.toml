[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexbotic-dw05"
version = "0.1.0"
description = "DW05 world-action model: joint video prediction and action generation for embodied intelligence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Dexmal", email = "contact@dexmal.ai" },
]
keywords = ["robotics", "world-model", "video-generation", "embodied-ai", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.49.0",
    "accelerate>=1.10.0",
    "deepspeed>=0.18.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "einops",
    "safetensors",
    "sentencepiece",
    "numpy==1.26.4",
    "Pillow",
    "tqdm",
    "loguru",
    "rich",
    "termcolor",
    "imageio",
    "imageio-ffmpeg",
    "megfile",
    "boto3==1.35.18",
    "botocore==1.35.66",
    "decord",
    "av",
    "albumentations",
    "opencv-python",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "modelscope",
    "wandb",
]

[project.urls]
"Homepage" = "https://github.com/dexmal/opendw"
"Source" = "https://github.com/dexmal/opendw"

[project.optional-dependencies]
attention = [
    "flash_attn",
    "xformers",
]

[tool.setuptools.packages.find]
include = ["dexbotic*"]
namespaces = true
