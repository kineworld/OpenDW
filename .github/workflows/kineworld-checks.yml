name: KineWorld focused checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "numpy>=1.24,<3"
      - run: python -m unittest discover -s tests_kineworld -v
